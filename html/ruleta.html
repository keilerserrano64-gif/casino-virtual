<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Casino — Ruleta</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/ruleta.css">
</head>
<body>

<div id="rc-header-root"></div>

<main class="rc-main roulette-main">
  <div class="roulette-layout">

    <div class="wheel-zone">
      <h1>🎡 Ruleta europea</h1>
      <div class="wheel" id="wheel" role="img" aria-label="Ruleta europea con 37 casillas"></div>
      <div class="result-number" id="resultNumber" aria-live="polite">—</div>
      <div class="history-strip" id="historyStrip"></div>
    </div>

    <section class="rc-panel roulette-panel">
      <h2>Elige tu apuesta</h2>
      <div class="bet-modes" id="betModes">
        <button class="rc-btn rc-btn-ghost active" data-mode="color" data-value="rojo">Rojo ×2</button>
        <button class="rc-btn rc-btn-ghost" data-mode="color" data-value="negro">Negro ×2</button>
        <button class="rc-btn rc-btn-ghost" data-mode="parity" data-value="par">Par ×2</button>
        <button class="rc-btn rc-btn-ghost" data-mode="parity" data-value="impar">Impar ×2</button>
        <button class="rc-btn rc-btn-ghost" data-mode="number" data-value="">Número ×35</button>
      </div>

      <div id="numberGrid" class="number-grid"></div>

      <div class="rc-bet-row bet-row--center mt-18">
        <label for="bet">Apuesta</label>
        <input type="number" id="bet" class="rc-bet-input" value="100" min="10" step="10">
        <button class="rc-chip-btn" data-add="100">+100</button>
        <button class="rc-chip-btn" data-add="500">+500</button>
      </div>

      <div class="center mt-18">
        <button class="rc-btn rc-btn-gold btn-lg" id="spinBtn">LANZAR</button>
      </div>
    </section>

  </div>
</main>

<footer class="rc-footer"><p>© Royal Casino · Monedas virtuales, sin dinero real. <a href="ayuda.html">Ayuda</a> · <a href="soporte.html">Soporte</a> · <a href="noticias.html">Noticias</a> · <a href="configuracion.html">Configuración</a></p></footer>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ruleta.js"></script>
</body>
</html>
