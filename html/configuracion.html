<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Casino — Configuración</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/configuracion.css">
</head>
<body>

<div id="rc-header-root"></div>

<main class="rc-main">
<h1>⚙️ Configuración</h1>
<section class="rc-panel" >
<h2>Cuenta</h2>
<form data-form="cuenta" novalidate><label class="rc-field" for="newUser">Nuevo nombre de usuario<input type="text" id="newUser" name="newUser" minlength="3" maxlength="18"></label><label class="rc-field" for="oldPass">Contraseña actual<input type="password" id="oldPass" name="oldPass" ></label><label class="rc-field" for="newPass">Nueva contraseña<input type="password" id="newPass" name="newPass" minlength="6"></label><label class="rc-field" for="newPass2">Confirmar nueva contraseña<input type="password" id="newPass2" name="newPass2" ></label><button class="rc-btn rc-btn-gold" type="submit">Guardar cambios</button><p class="form-error" id="formError" role="alert"></p></form>
</section>
<section class="rc-panel" style="margin-top:20px;">
<h2>Preferencias</h2>
<div class="pref-list">
  <label class="rc-field" for="theme">Tema<select id="theme" class="rc-select"><option value="oscuro">Oscuro</option><option value="claro">Claro</option></select></label>
  <label class="rc-field" for="lang">Idioma<select id="lang" class="rc-select"><option value="es">Español</option><option value="en">English</option></select></label>
  <label class="rc-check"><input type="checkbox" id="prefSound" checked> Sonido</label>
  <label class="rc-check"><input type="checkbox" id="prefAnim" checked> Animaciones</label>
  <label class="rc-check"><input type="checkbox" id="prefNotif" checked> Notificaciones</label>
</div>
</section>
<section class="rc-panel" style="margin-top:20px;">
<h2>Sesión</h2>
<button class="rc-btn rc-btn-burgundy" id="logoutBtn">Cerrar sesión</button> <button class="rc-btn rc-btn-ghost" id="resetBtn">Reiniciar mi cuenta</button>
</section>
</main>

<footer class="rc-footer"><p>© Royal Casino · Monedas virtuales, sin dinero real. <a href="ayuda.html">Ayuda</a> · <a href="soporte.html">Soporte</a> · <a href="noticias.html">Noticias</a> · <a href="configuracion.html">Configuración</a></p></footer>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/configuracion.js"></script>
</body>
</html>
