<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Casino — Dados</title>
<link rel="stylesheet" href="../css/dados.css">
</head>
<body>

<div id="rc-header-root"></div>

<main class="rc-main">
  <div class="dice-zone">
    <h1>🎲 Dados</h1>
    <div class="dice-pair">
      <div class="die" id="die1"></div>
      <div class="die" id="die2"></div>
    </div>
    <div class="sum-display" id="sumDisplay">Suma: —</div>
    <div id="diceMsg" style="min-height:1.4em; color:var(--gold-300); font-weight:600;"></div>
  </div>

  <section class="rc-panel" style="max-width:480px; margin:26px auto 0;">
    <h2 style="font-size:1rem">Elige tu modo</h2>
    <div class="modes" id="modes">
      <button class="rc-btn rc-btn-ghost active" data-mode="mayor">Suma &gt; 7 · ×2</button>
      <button class="rc-btn rc-btn-ghost" data-mode="menor">Suma &lt; 7 · ×2</button>
      <button class="rc-btn rc-btn-ghost" data-mode="igual7">Suma = 7 · ×5</button>
      <button class="rc-btn rc-btn-ghost" data-mode="doble">Dobles · ×8</button>
    </div>

    <div class="rc-bet-row" style="justify-content:center; margin-top:18px;">
      <label for="bet">Apuesta</label>
      <input type="number" id="bet" class="rc-bet-input" value="100" min="10" step="10">
      <button class="rc-chip-btn" data-add="100">+100</button>
      <button class="rc-chip-btn" data-add="500">+500</button>
    </div>

    <div style="text-align:center; margin-top:18px;">
      <button class="rc-btn rc-btn-gold" id="rollBtn" style="padding:14px 40px; font-size:1.05rem;">LANZAR DADOS</button>
    </div>
  </section>
</main>

<script src="../js/app.js"></script>
<script src="../js/dados.js"></script>
</body>
</html>
