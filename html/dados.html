<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Casino — Dados</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/juegos.css">
<link rel="stylesheet" href="../css/dados.css">
</head>
<body>

<div id="rc-header-root"></div>

<main class="rc-main">
  <div class="zone">
    <h1>🎲 Dados</h1>
    <div class="dice-pair">
      <div class="die" id="die1"></div>
      <div class="die" id="die2"></div>
    </div>
    <div class="sum-display" id="sumDisplay">Suma: —</div>
    <div class="game-msg" id="diceMsg" aria-live="polite"></div>
  </div>

  <section class="rc-panel panel-narrow">
    <h2>Elige tu modo</h2>
    <!-- Los textos y multiplicadores de los botones los rellena dados.js -->
    <div class="choice-row" id="modes">
      <button class="rc-btn rc-btn-ghost active" data-mode="mayor">Suma &gt; 7</button>
      <button class="rc-btn rc-btn-ghost" data-mode="menor">Suma &lt; 7</button>
      <button class="rc-btn rc-btn-ghost" data-mode="igual7">Suma = 7</button>
      <button class="rc-btn rc-btn-ghost" data-mode="doble">Dobles</button>
    </div>

    <div class="rc-bet-row bet-row--center">
      <label for="bet">Apuesta</label>
      <input type="number" id="bet" class="rc-bet-input" value="100" min="10" step="10">
      <button class="rc-chip-btn" data-add="100">+100</button>
      <button class="rc-chip-btn" data-add="500">+500</button>
    </div>

    <div class="center mt-18">
      <button class="rc-btn rc-btn-gold btn-lg" id="rollBtn">LANZAR DADOS</button>
    </div>
  </section>
</main>

<footer class="rc-footer"><p>© Royal Casino · Monedas virtuales, sin dinero real. <a href="ayuda.html">Ayuda</a> · <a href="soporte.html">Soporte</a> · <a href="noticias.html">Noticias</a> · <a href="configuracion.html">Configuración</a></p></footer>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/dados.js"></script>
</body>
</html>
