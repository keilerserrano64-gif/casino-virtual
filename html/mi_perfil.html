<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Casino — Mi perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@600;800&display=swap">

<body class="vg">

<div id="rc-header-root"></div>

<main class="rc-main">

  <section class="rc-panel vg-bulbed pf-card">
    <div class="profile-head">
      <div class="profile-avatar">👤</div>
      <div>
        <div class="profile-name" id="pName">Jugador</div>
        <div class="profile-title" id="pTitle">—</div>
        <div class="edit-row">
          <input type="text" id="nameInput" placeholder="Cambiar tu nombre" maxlength="18">
          <button class="rc-btn rc-btn-gold" id="saveNameBtn">Guardar</button>
        </div>
      </div>
    </div>

    <div class="xp-block">
      <div class="xp-meta">
        <span>Nivel <span id="pLevel">1</span></span>
        <span id="pXpText">0 / 500 XP</span>
      </div>
      <div class="rc-xp-bar"><div class="rc-xp-fill" id="pXpBar" style="width:0%"></div></div>
    </div>

    <div class="rc-stat-row">
      <div class="rc-stat"><div class="num" id="pCoins">—</div><div class="lbl">Monedas</div></div>
      <div class="rc-stat"><div class="num" id="pWins">—</div><div class="lbl">Victorias</div></div>
      <div class="rc-stat"><div class="num" id="pLosses">—</div><div class="lbl">Derrotas</div></div>
      <div class="rc-stat"><div class="num" id="pGames">—</div><div class="lbl">Partidas</div></div>
      <div class="rc-stat"><div class="num" id="pWinRate">—</div><div class="lbl">% victorias</div></div>
      <div class="rc-stat"><div class="num" id="pStreak">—</div><div class="lbl">Racha diaria</div></div>
    </div>
  </section>

  <section class="rc-panel profile-actions">
    <a href="configuracion.html" class="rc-btn rc-btn-ghost">✏️ Editar perfil</a>
    <a href="historial.html" class="rc-btn rc-btn-ghost">📜 Historial</a>
    <a href="logros.html" class="rc-btn rc-btn-ghost">⭐ Logros</a>
    <a href="billetera.html" class="rc-btn rc-btn-ghost">💰 Billetera</a>
    <a href="estadisticas.html" class="rc-btn rc-btn-ghost">📊 Estadísticas</a>
    <a href="configuracion.html" class="rc-btn rc-btn-ghost">⚙️ Configuración</a>
  </section>
</main>
