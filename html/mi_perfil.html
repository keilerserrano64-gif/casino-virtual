v<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Casino — Mi perfil</title>
<link rel="stylesheet" href="../css/mi_perfil.css">
</head>
<body>

<div id="rc-header-root"></div>

<main class="rc-main">

  <section class="rc-panel">
    <div class="profile-head">
      <div class="profile-avatar">👤</div>
      <div>
        <div class="profile-name" id="pName">Jugador</div>
        <div class="profile-title" id="pTitle">—</div>
        <div class="edit-row">
          <input type="text" id="nameInput" placeholder="Cambiar tu nombre" maxlength="18">
          <button class="rc-btn rc-btn-ghost" id="saveNameBtn">Guardar</button>
        </div>
      </div>
    </div>

    <div style="margin-top:20px;">
      <div style="display:flex; justify-content:space-between; font-size:.78rem; opacity:.7; margin-bottom:6px;">
        <span>Nivel <span id="pLevel">1</span></span>
        <span id="pXpText">0 / 500 XP</span>
      </div>
      <div class="rc-xp-bar"><div class="rc-xp-fill" id="pXpBar" style="width:0%"></div></div>
    </div>

    <div class="rc-stat-row">
      <div class="rc-stat"><div class="num" id="pCoins">—</div><div class="lbl">Monedas</div></div>
      <div class="rc-stat"><div class="num" id="pWins">—</div><div class="lbl">Victorias</div></div>
      <div class="rc-stat"><div class="num" id="pLosses">—</div><div class="lbl">Derrotas</div></div>
      <div class="rc-stat"><div class="num" id="pGames">—</div><div class="lbl">Partidas</div></div>
      <div class="rc-stat"><div class="num" id="pWinRate">—</div><div class="lbl">% victorias</div></div>
      <div class="rc-stat"><div class="num" id="pStreak">—</div><div class="lbl">Racha diaria</div></div>
    </div>
  </section>

  <section class="rc-panel" style="margin-top:20px; display:flex; gap:12px; flex-wrap:wrap;">
    <a href="historial.html" class="rc-btn rc-btn-ghost">Ver historial</a>
    <a href="bonificasiones.html" class="rc-btn rc-btn-ghost">Ver logros y bonificaciones</a>
  </section>
</main>

<script src="../js/app.js"></script>
<script src="../js/mi_perfil.js"></script>
</body>
</html>
