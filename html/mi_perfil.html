      <div class="rc-stat"><div class="num" id="pGames">—</div><div class="lbl">Partidas</div></div>
      <div class="rc-stat"><div class="num" id="pWinRate">—</div><div class="lbl">% victorias</div></div>
      <div class="rc-stat"><div class="num" id="pStreak">—</div><div class="lbl">Racha diaria</div></div>
    </div>
  </section>
