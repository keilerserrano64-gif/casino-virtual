<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Casino — Carreras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@600;800&display=swap">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/carreras.css">
<link rel="stylesheet" href="../css/vegas.css">

</head>
<body class="race-page vg">

<div class="race-ambient" aria-hidden="true"><div class="beam b1"></div><div class="beam b2"></div></div>

<div id="rc-header-root"></div>

<main class="rc-main">
  <h1 class="race-title">🏇 Carrera virtual</h1>
  <p class="race-sub">Elige tu caballo y el tipo de apuesta. Las cuotas se calculan con las estadísticas y la condición del día de cada caballo (pasa el cursor sobre uno para verlas).</p>

  <section class="rc-panel" style="max-width:640px; margin:0 auto;">
    <div class="horse-pick" id="horsePick"></div>

    <div class="track" id="track"></div>

    <div class="rc-bet-row" style="justify-content:center;">
      <label for="betKind">Tipo</label>
      <select id="betKind" class="rc-bet-input" aria-label="Tipo de apuesta"></select>
      <label for="bet">Apuesta</label>
      <input type="number" id="bet" class="rc-bet-input" value="100" min="10" step="10">
      <button class="rc-chip-btn" data-add="100">+100</button>
      <button class="rc-chip-btn" data-add="500">+500</button>
    </div>

    <div style="text-align:center; margin-top:16px;">
      <button class="rc-btn rc-btn-gold" id="startBtn" style="padding:14px 40px; font-size:1.05rem;">¡A CORRER!</button>
    </div>

    <div style="text-align:center; margin-top:14px; font-family:var(--font-display); color:var(--gold-400); font-size:1.15rem;" id="raceMsg"></div>
  </section>
</main>

<footer class="rc-footer"><p>© Royal Casino · Monedas virtuales, sin dinero real. <a href="ayuda.html">Ayuda</a> · <a href="soporte.html">Soporte</a> · <a href="noticias.html">Noticias</a> · <a href="configuracion.html">Configuración</a></p></footer>

<script src="../js/app.js"></script>
<script type="module" src="../js/firebase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/carreras_engine.js"></script>
<script src="../js/carreras.js"></script>
</body>
</html>
