<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Casino — Blackjack</title>
<link rel="stylesheet" href="../css/juegos.css">
<link rel="stylesheet" href="../css/Blackjack.css">
</head>
<body>

<div id="rc-header-root"></div>

<main class="rc-main">
  <h1 class="game-title">🃏 Blackjack</h1>

  <div class="zone">
    <div class="hand-block">
      <div class="hand-title"><span>Repartidor</span><span class="score" id="dealerScore">—</span></div>
      <div class="cards" id="dealerCards"></div>
    </div>

    <div class="game-msg" id="bjMsg" aria-live="polite">Coloca tu apuesta y reparte.</div>

    <div class="hand-block">
      <div class="hand-title"><span>Tú</span><span class="score" id="playerScore">—</span></div>
      <div class="cards" id="playerCards"></div>
    </div>

    <div class="rc-bet-row" id="betRow">
      <label for="bet">Apuesta</label>
      <input type="number" id="bet" class="rc-bet-input" value="100" min="10" step="10">
      <button class="rc-chip-btn" data-add="100">+100</button>
      <button class="rc-chip-btn" data-add="500">+500</button>
    </div>

    <div class="controls">
      <button class="rc-btn rc-btn-gold" id="dealBtn">Repartir</button>
      <button class="rc-btn rc-btn-burgundy" id="hitBtn" disabled>Pedir</button>
      <button class="rc-btn rc-btn-ghost" id="standBtn" disabled>Plantarse</button>
    </div>
  </div>
</main>

<script src="../js/app.js"></script>
<script src="../js/Blackjack.js"></script>
</body>
</html>
