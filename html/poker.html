<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Casino — Poker</title>
<link rel="stylesheet" href="../css/juegos.css">
<link rel="stylesheet" href="../css/poker.css">
</head>
<body>

<div id="rc-header-root"></div>

<main class="rc-main">
  <h1 class="game-title">♠️ Poker — Texas Hold'em</h1>
  <p class="subtitle">Versión simplificada 1 contra 1 frente a la banca. Apuesta en cada ronda o retírate.</p>

  <div class="zone">
    <div>
      <div class="stage-label">BANCA</div>
      <div class="cards" id="botCards"></div>
    </div>

    <div>
      <div class="stage-label">MESA</div>
      <div class="cards" id="community"></div>
    </div>

    <div class="pot-line" id="potLine">Bote: 0</div>
    <div class="game-msg" id="pokerMsg" aria-live="polite">Fija tu apuesta inicial y reparte.</div>

    <div>
      <div class="stage-label">TU MANO</div>
      <div class="cards" id="playerCards"></div>
    </div>

    <div class="rc-bet-row" id="betRow">
      <label for="bet">Apuesta inicial</label>
      <input type="number" id="bet" class="rc-bet-input" value="100" min="10" step="10">
    </div>

    <div class="controls">
      <button class="rc-btn rc-btn-gold" id="dealBtn">Repartir</button>
      <button class="rc-btn rc-btn-burgundy" id="betBtn" disabled>Apostar</button>
      <button class="rc-btn rc-btn-ghost" id="foldBtn" disabled>Retirarse</button>
    </div>
  </div>
</main>

<script src="../js/app.js"></script>
<script src="../js/poker.js"></script>
</body>
</html>
