<body class="vg">

<div id="rc-header-root"></div>

<main class="rc-main">
  <section class="rc-panel vg-bulbed vg-hero">
    <p class="vg-kicker">Tus últimas partidas</p>
    <h1><span class="vg-neon-red">HISTORIAL DE</span> <span class="vg-gold-txt">PARTIDAS</span></h1>
    <p class="vg-sub">De la más reciente a la más antigua.</p>
    <div class="vg-hero-art" aria-hidden="true">📜</div>
  </section>

  <div class="rc-stat-row hs-stats">
    <div class="rc-stat"><div class="num" id="hsGames">0</div><div class="lbl">Partidas</div></div>
    <div class="rc-stat"><div class="num" id="hsWins">0</div><div class="lbl">Ganadas</div></div>
    <div class="rc-stat"><div class="num" id="hsLosses">0</div><div class="lbl">Perdidas</div></div>
    <div class="rc-stat"><div class="num" id="hsRate">0%</div><div class="lbl">% victorias</div></div>
  </div>

  <section class="rc-panel hs-filters">
    <select id="filterGame" class="rc-select" aria-label="Filtrar por juego"><option value="todos">Todos los juegos</option></select>
    <select id="filterResult" class="rc-select" aria-label="Filtrar por resultado"><option value="todos">Todos los resultados</option><option value="win">Ganadas</option><option value="lose">Perdidas</option><option value="push">Empates</option></select>
    <a href="billetera.html" class="rc-btn rc-btn-ghost"><svg class="ic ic-coins" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6" /><path d="M18.09 10.37A6 6 0 1 1 10.34 18" /><path d="M7 6h1v4" /><path d="m16.71 13.88.7.71-2.82 2.82" /></svg> Ver billetera</a>
  </section>

  <section class="rc-panel">
    <div class="history-bar">
      <span id="countLabel">0 partidas registradas</span>
      <button class="rc-btn rc-btn-ghost" id="clearBtn"><svg class="ic ic-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg> Borrar historial</button>
    </div>
    <div id="tableWrap"></div>
