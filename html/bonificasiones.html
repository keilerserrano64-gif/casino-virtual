<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Casino — Bonificaciones</title>
<link rel="stylesheet" href="../css/bonificasiones.css">
</head>
<body>

<div id="rc-header-root"></div>

<main class="rc-main">
  <h1>🎁 Bonificaciones</h1>

  <div class="bonus-row">
    <div class="rc-panel bonus-card">
      <div class="big">🎁</div>
      <h3 style="font-size:1rem">Bono diario</h3>
      <p style="opacity:.7; font-size:.82rem" id="bonusDesc">—</p>
      <button class="rc-btn rc-btn-gold" id="claimBonusBtn" style="margin-top:10px;">Reclamar</button>
    </div>

    <div class="rc-panel bonus-card">
      <div class="big">🔥</div>
      <h3 style="font-size:1rem">Racha de días</h3>
      <p style="font-family:var(--font-display); font-size:1.6rem; color:var(--gold-400)" id="streakNum">0</p>
      <p style="opacity:.7; font-size:.78rem">días consecutivos</p>
    </div>
  </div>

  <section class="rc-panel" style="margin-top:20px;">
    <h2 style="font-size:1rem">🎯 Misión del día — Juega 3 partidas</h2>
    <div class="mission-progress">
      <div class="bar-label"><span id="missionText">0/3</span><span>+500 monedas · +100 XP</span></div>
      <div class="rc-xp-bar"><div class="rc-xp-fill" id="missionBar" style="width:0%"></div></div>
    </div>
    <button class="rc-btn rc-btn-burgundy" id="claimMissionBtn" disabled>Reclamar recompensa</button>
  </section>

  <section class="rc-panel" style="margin-top:20px;">
    <h2 style="font-size:1rem">⭐ Logros</h2>
    <div class="achv-grid" id="achvGrid"></div>
  </section>
</main>

<script src="../js/app.js"></script>
<script src="../js/bonificasiones.js"></script>
</body>
</html>
