<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Casino — Soporte</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/soporte.css">
</head>
<body>

<div id="rc-header-root"></div>

<main class="rc-main">
<h1>📞 Centro de soporte</h1>
<section class="rc-panel" >
<h2>¿Qué necesitas?</h2>
<form data-form="ticket" novalidate>
  <label class="rc-field" for="categoria">Categoría<select id="categoria" class="rc-select">
    <option>Problema con mi cuenta</option><option>Problema con un juego</option><option>Monedas o billetera</option><option>Sugerencia</option><option>Otro</option></select></label>
  <label class="rc-field" for="descripcion">Describe tu problema<textarea id="descripcion" rows="5" minlength="10" maxlength="500" required></textarea></label>
  <button class="rc-btn rc-btn-gold" type="submit">Enviar solicitud</button>
  <p class="form-error" id="formError" role="alert"></p>
</form>
</section>
<section class="rc-panel" style="margin-top:20px;">
<h2>Mis solicitudes</h2>
<div class="table-wrap"><table class="rc-table"><thead><tr><th>N.º</th><th>Fecha</th><th>Categoría</th><th>Estado</th></tr></thead><tbody id="ticketBody"></tbody></table></div>
</section>
</main>

<footer class="rc-footer"><p>© Royal Casino · Monedas virtuales, sin dinero real. <a href="ayuda.html">Ayuda</a> · <a href="soporte.html">Soporte</a> · <a href="noticias.html">Noticias</a> · <a href="configuracion.html">Configuración</a></p></footer>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/soporte.js"></script>
</body>
</html>
