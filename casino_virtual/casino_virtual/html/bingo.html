<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Casino — Bingo</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/juegos.css">
<link rel="stylesheet" href="../css/bingo.css">
</head>
<body>

<div id="rc-header-root"></div>

<main class="rc-main">
<h1 class="game-title">🎱 Bingo</h1>
<p class="subtitle">Marca los números que van saliendo. Completa una línea o el cartón para ganar.</p>
<div class="zone">
  <div class="stage-label">ÚLTIMA BOLA</div>
  <div class="bingo-ball" id="currentBall">—</div>
  <div class="cards" id="calledBalls"></div>
  <div class="game-msg" id="bingoMsg" aria-live="polite">Compra tu cartón y empieza.</div>
  <div class="stage-label">TU CARTÓN</div>
  <div class="bingo-card" id="bingoCard"></div>
  <div class="rc-bet-row" id="betRow"><label for="bet">Precio del cartón</label><input type="number" id="bet" class="rc-bet-input" value="100" min="10" step="10"></div>
  <div class="controls">
    <button class="rc-btn rc-btn-gold" id="buyBtn">Comprar cartón</button>
    <button class="rc-btn rc-btn-burgundy" id="drawBtn" disabled>Sacar bola</button>
    <button class="rc-btn rc-btn-ghost" id="bingoBtn" disabled>¡BINGO!</button>
  </div>
</div>
</main>

<footer class="rc-footer"><p>© Royal Casino · Monedas virtuales, sin dinero real. <a href="ayuda.html">Ayuda</a> · <a href="soporte.html">Soporte</a> · <a href="noticias.html">Noticias</a> · <a href="configuracion.html">Configuración</a></p></footer>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/bingo.js"></script>
</body>
</html>
