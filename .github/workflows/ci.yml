name: CI
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Pruebas de los motores
        run: for t in tests/*_engine.test.js tests/firebase_auth.test.js; do node "$t"; done
      - name: Compilar TypeScript del frontend
        run: npx -y -p typescript tsc -p ts
      - name: Backend (instalar y compilar)
        run: cd backend && npm install && npm run build
      - name: RTP del tragamonedas
        run: python python/simulador_rtp.py 200000
