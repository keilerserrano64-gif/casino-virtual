# Sitio estático + proxy hacia el backend (API y WebSockets). Cambia TU-DOMINIO.com.
server {
  listen 80;
  server_name TU-DOMINIO.com;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name TU-DOMINIO.com;
  ssl_certificate     /etc/letsencrypt/live/TU-DOMINIO.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/TU-DOMINIO.com/privkey.pem;
  root /var/www/royal-casino;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location ~* \.(css|js|webp|png|jpg|svg|woff2)$ { expires 30d; add_header Cache-Control "public, immutable"; }
  location /api/ { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /socket.io/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
